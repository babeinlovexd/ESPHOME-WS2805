name: Build and release
'on':
  push:
    branches:
    - '**'
    tags:
    - v*
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Check version and package source
      run: python ci/release.py --package
    - uses: actions/upload-artifact@v7
      with:
        name: source
        path: release-output/*
        if-no-files-found: error
  esphome:
    name: ESPHome ${{ matrix.esphome }} / ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        esphome: ['2026.10.2', '2026.11.0', latest]
        target:
          - name: ESP32
            config: tests/issue59.yaml
          - name: ESP32-S3
            config: tests/test.yaml
          - name: ESP32 (sparse dimming)
            config: tests/sparse-dimming.yaml
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Install ESPHome version under test
      env:
        ESPHOME_VERSION: ${{ matrix.esphome }}
      run: |
        if [ "$ESPHOME_VERSION" = latest ]; then
          python -m pip install esphome
        else
          python -m pip install "esphome==$ESPHOME_VERSION"
        fi
    - name: Compile with CI placeholders
      env:
        TEST_CONFIG: ${{ matrix.target.config }}
      run: python ci/esphome_check.py "$TEST_CONFIG"
  tests:
    name: Schema and five-channel buffer regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: python -m pip install pytest
    - run: python -m pytest -q tests/ws2805/test_light.py
    - name: Check RGB access, white isolation and buffer lifecycle
      run: |
        g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
          -DUSE_LIGHT_PARTITION -DUSE_LIGHT_POWER_ESTIMATION \
          -Itests/accessor_mocks -Icomponents/ws2805 \
          tests/ws2805/test_color_accessor.cpp -o "$RUNNER_TEMP/test_color_accessor"
        "$RUNNER_TEMP/test_color_accessor"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
    - source
    - esphome
    - tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        path: release-output
        merge-multiple: true
    - name: Hash complete downloads
      working-directory: release-output
      run: |-
        find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
        sha256sum -c SHA256SUMS.txt
    - name: Publish complete release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      run: gh release create "$TAG" release-output/* --verify-tag --title "${GITHUB_REPOSITORY#*/} $TAG" --notes-file RELEASE-NOTES.md
