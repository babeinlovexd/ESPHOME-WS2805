name: Build and release
'on':
  push:
    branches:
    - '**'
    tags:
    - v*
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - name: Check version and package source
      run: python ci/release.py --package
    - uses: actions/upload-artifact@v7
      with:
        name: source
        path: release-output/*
        if-no-files-found: error
  esphome:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    - run: python -m pip install esphome==2026.10.2
    - name: Compile with CI placeholders
      run: python ci/esphome_check.py "tests/test.yaml"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
    - source
    - esphome
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/download-artifact@v8
      with:
        path: release-output
        merge-multiple: true
    - name: Hash complete downloads
      working-directory: release-output
      run: |-
        find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
        sha256sum -c SHA256SUMS.txt
    - name: Publish complete release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        TAG: ${{ github.ref_name }}
      run: gh release create "$TAG" release-output/* --verify-tag --title "${GITHUB_REPOSITORY#*/} $TAG" --notes-file RELEASE-NOTES.md
